services:
  namor-bot:
    platform: linux/amd64
    image: ghcr.io/midianok/namor:latest
    build:
      context: .
      dockerfile: ./Saturn.Telegram.Bot/Dockerfile
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy

  namor-api:
    platform: linux/amd64
    image: ghcr.io/midianok/namor-api:latest
    build:
      context: .
      dockerfile: ./Saturn.Telegram.Api/Dockerfile
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy_net
  
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
    
networks:
  proxy_net:
    external: true 
    